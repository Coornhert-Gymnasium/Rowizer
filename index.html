<!DOCTYPE html>

    <script>
        // Herlaad alleen als de site bereikbaar is: zonder netwerk zou het scherm blijven hangen op de foutpagina van de browser.
        window.rowizerReload = function () {
            fetch(location.href, {method: "HEAD", cache: "no-store"}).then(function (response) {
                if (response.status < 500) {
                    location.reload()
                }
            }).catch(function (e) {
                console.warn("Site not reachable, not reloading", e)
            })
        }
        // Als de scripts niet geladen konden worden start de app nooit: probeer het dan opnieuw.
        setInterval(function () {
            if (!window.rowizerStarted) {
                window.rowizerReload()
            }
        }, 60 * 1000)
    </script>
    <script src="js/script.js" type="module"></script>
